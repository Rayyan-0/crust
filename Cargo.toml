[package]
name = "crust"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
humantime = "2.4.0"
anyhow = "1.0.104"
jiff = "0.2.37"
clap = { version = "4.6.7", features = ["derive"] }
